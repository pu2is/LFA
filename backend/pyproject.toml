[project]
name = "lfa-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "docx2txt>=0.9",
    "fastapi[standard]>=0.136.3",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.13.2",
    "redis>=8.0.0",
    "rq>=2.9.0",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    # langchain-community warns about its own sunset; suppressed until a stable
    # standalone loader package exists (see processing/extraction.py).
    "ignore:.*langchain-community.*:DeprecationWarning",
]
